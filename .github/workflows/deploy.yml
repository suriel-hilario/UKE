name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    branches: [master]
    types: [completed]

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Write .env.prod and deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "${{ secrets.DO_ENV_PROD }}" | base64 -d > /opt/uke/.env.prod
            cd /opt/uke
            ./deploy.sh

      - name: Health check
        run: |
          curl --insecure --fail --retry 5 --retry-delay 5 --retry-connrefused \
            "https://${{ secrets.DO_DROPLET_IP }}/api/health"
