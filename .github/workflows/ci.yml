name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm --filter @workspace/api exec prisma generate

      - name: Typecheck API
        run: pnpm --filter @workspace/api exec tsc --noEmit

      - name: Typecheck web
        run: pnpm --filter @workspace/web exec tsc --noEmit

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uke_user
          POSTGRES_PASSWORD: uke_password
          POSTGRES_DB: uke_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uke_user -d uke_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://uke_user:uke_password@localhost:5432/uke_dev
      AUTH0_DOMAIN: uke-ci.eu.auth0.com
      AUTH0_AUDIENCE: https://uke-ci.local/api
      AUTH0_ROLE_CLAIM: https://uke.local/rol
      AUTH0_M2M_CLIENT_ID: ci-placeholder-client-id
      AUTH0_M2M_CLIENT_SECRET: ci-placeholder-client-secret
      AUTH0_M2M_AUDIENCE: https://uke-ci.local/m2m
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: uke-fotos
      S3_ACCESS_KEY: uke_minio
      S3_SECRET_KEY: uke_minio_secret
      S3_REGION: us-east-1
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@uke-ci.local
      APP_BASE_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Start MinIO
        # GitHub Actions service containers can't override a command, and the
        # minio image needs `server /data` passed explicitly — so MinIO runs
        # as a plain `docker run` step instead of a `services:` entry. Pulled
        # from quay.io, not Docker Hub: minio/minio on Docker Hub no longer
        # accepts anonymous pulls (MinIO publishes there under a different
        # policy now), while quay.io/minio/minio is still public.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=uke_minio \
            -e MINIO_ROOT_PASSWORD=uke_minio_secret \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Apply Prisma migrations
        run: pnpm --filter @workspace/api exec prisma migrate deploy

      - name: Generate Prisma Client
        run: pnpm --filter @workspace/api exec prisma generate

      - name: Run unit tests
        run: pnpm --filter @workspace/api test

      - name: Run e2e tests
        run: pnpm --filter @workspace/api test:e2e

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio
  build-web:
    name: Build web
    runs-on: ubuntu-latest
    env:
      VITE_AUTH0_DOMAIN: uke-ci.eu.auth0.com
      VITE_AUTH0_CLIENT_ID: ci-placeholder-client-id
      VITE_AUTH0_AUDIENCE: https://uke-ci.local/api
      VITE_API_URL: /api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run frontend tests
        run: pnpm --filter @workspace/web test

      - name: Build
        run: pnpm --filter @workspace/web build

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: test-api
    # Advisory while the suite stabilizes (see openspec/changes/add-e2e-tests/design.md D6).
    # Remove once 5 consecutive runs on master are green, so failures start blocking merges.
    continue-on-error: true
    env:
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_AUTH0_ID: ${{ secrets.E2E_ADMIN_AUTH0_ID }}
      E2E_DIRECTOR_EMAIL: ${{ secrets.E2E_DIRECTOR_EMAIL }}
      E2E_DIRECTOR_PASSWORD: ${{ secrets.E2E_DIRECTOR_PASSWORD }}
      E2E_DIRECTOR_AUTH0_ID: ${{ secrets.E2E_DIRECTOR_AUTH0_ID }}
      E2E_COORDINADOR_EMAIL: ${{ secrets.E2E_COORDINADOR_EMAIL }}
      E2E_COORDINADOR_PASSWORD: ${{ secrets.E2E_COORDINADOR_PASSWORD }}
      E2E_COORDINADOR_AUTH0_ID: ${{ secrets.E2E_COORDINADOR_AUTH0_ID }}
      E2E_ENTRENADOR_EMAIL: ${{ secrets.E2E_ENTRENADOR_EMAIL }}
      E2E_ENTRENADOR_PASSWORD: ${{ secrets.E2E_ENTRENADOR_PASSWORD }}
      E2E_ENTRENADOR_AUTH0_ID: ${{ secrets.E2E_ENTRENADOR_AUTH0_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Write .env.test for the docker-compose.prod.yml stack
        run: echo "${{ secrets.E2E_ENV_PROD }}" | base64 -d > .env.test

      - name: Run e2e suite
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
