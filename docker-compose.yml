services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - uke-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3001:3001"
      - "5555:5555"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://uke_user:uke_password@postgres:5432/uke_dev
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - AUTH0_ROLE_CLAIM=${AUTH0_ROLE_CLAIM}
      - AUTH0_M2M_CLIENT_ID=${AUTH0_M2M_CLIENT_ID}
      - AUTH0_M2M_CLIENT_SECRET=${AUTH0_M2M_CLIENT_SECRET}
      - AUTH0_M2M_AUDIENCE=${AUTH0_M2M_AUDIENCE}
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9000}
      - S3_BUCKET=${S3_BUCKET:-uke-fotos}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-uke_minio}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-uke_minio_secret}
      - S3_REGION=${S3_REGION:-us-east-1}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-UKE App <noreply@uke.local>}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - TZ=${TZ:-Europe/Madrid}
    command: sh -c "pnpm --filter @workspace/api dev"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - uke-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - uke-network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-uke_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-uke_minio_secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uke-network

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: uke_user
      POSTGRES_PASSWORD: uke_password
      POSTGRES_DB: uke_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uke_user -d uke_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uke-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  api_node_modules:
    driver: local
  api_app_node_modules:
    driver: local
  web_app_node_modules:
    driver: local
  shared_node_modules:
    driver: local

networks:
  uke-network:
    driver: bridge
